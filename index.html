<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="生詞集解 — 195 詞條，16 類，附拼音與釋義。">
<meta name="color-scheme" content="light dark">
<title>生詞集解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&family=Noto+Sans:wght@400;500;600&display=swap">
<style>
/* 宣紙・靛藍・硃砂 ── 線裝書意象 */
:root{
  --paper:#e9e2d3; --surface:#f3ede1; --surface-2:#ded5c0;
  --ink:#2b241b; --ink-soft:#5f5546; --ink-faint:#8d8271;
  --rule:#c9bda3; --rule-soft:#d9cfb8;
  --indigo:#274a72; --indigo-deep:#1c3757; --indigo-soft:#d6dde7;
  --cinnabar:#a8342a; --cinnabar-soft:#ead7d2;
  --seal-ink:#f3ede1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14110d; --surface:#1d1913; --surface-2:#2a241b;
    --ink:#e7ddc8; --ink-soft:#a5977f; --ink-faint:#7a6e5c;
    --rule:#3a3327; --rule-soft:#2c261d;
    --indigo:#8fb4dc; --indigo-deep:#a8c7e8; --indigo-soft:#1d2836;
    --cinnabar:#d9705f; --cinnabar-soft:#2e1c18;
    --seal-ink:#14110d;
  }
}
:root[data-theme="dark"]{
  --paper:#14110d; --surface:#1d1913; --surface-2:#2a241b;
  --ink:#e7ddc8; --ink-soft:#a5977f; --ink-faint:#7a6e5c;
  --rule:#3a3327; --rule-soft:#2c261d;
  --indigo:#8fb4dc; --indigo-deep:#a8c7e8; --indigo-soft:#1d2836;
  --cinnabar:#d9705f; --cinnabar-soft:#2e1c18;
  --seal-ink:#14110d;
}

*{box-sizing:border-box}
html{background:var(--paper)}
body{
  margin:0; color:var(--ink);
  background:var(--paper);
  /* 宣紙纖維：極淡的交錯紋理 */
  background-image:
    repeating-linear-gradient(102deg, rgba(120,100,60,.030) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(11deg,  rgba(120,100,60,.022) 0 1px, transparent 1px 11px);
  font-family:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",'標楷體',"KaiTi",
              "Noto Serif TC","PMingLiU",serif;
  font-size:17px; line-height:1.95;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body{background-image:
    repeating-linear-gradient(102deg, rgba(220,200,150,.026) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(11deg,  rgba(220,200,150,.018) 0 1px, transparent 1px 11px);}
}
:root[data-theme="dark"] body{background-image:
  repeating-linear-gradient(102deg, rgba(220,200,150,.026) 0 1px, transparent 1px 7px),
  repeating-linear-gradient(11deg,  rgba(220,200,150,.018) 0 1px, transparent 1px 11px);}

.wrap{max-width:900px; margin:0 auto; padding:34px 20px 90px}

/* ── 版框：外粗內細雙欄框 ── */
.frame{
  border:3px double var(--ink); padding:0;
  background:linear-gradient(var(--surface),var(--surface));
  background-clip:padding-box;
}
.frame-in{border:1px solid var(--rule); margin:5px; padding:34px 40px 46px}

/* ── 書名頁 ── */
header.top{display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap}
.seal{
  flex:none; width:96px; height:96px; background:var(--cinnabar);
  display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
  place-items:center; color:var(--seal-ink); font-size:1.55rem; font-weight:700;
  line-height:1; box-shadow:inset 0 0 0 3px var(--cinnabar);
}
.seal span{transform:translateY(1px)}
.title-block{flex:1 1 320px; min-width:250px}
.eyebrow{
  margin:0 0 6px; font-family:"Noto Sans","Segoe UI",Helvetica,Arial,sans-serif;
  font-size:.85rem; letter-spacing:.16em; color:var(--ink-faint);
}
h1{
  margin:0; font-size:clamp(2.3rem,6vw,3.1rem); font-weight:700;
  letter-spacing:.16em; line-height:1.25; text-wrap:balance;
}
.lede{margin:12px 0 0; max-width:58ch; color:var(--ink-soft); font-size:.98rem}
.stats{
  display:flex; flex-wrap:wrap; gap:4px 24px; margin:18px 0 0;
  font-size:.86rem; color:var(--ink-faint); font-variant-numeric:tabular-nums;
}
.stats b{color:var(--indigo); font-weight:700; font-size:1.02rem}
hr.rule{border:0; border-top:1px solid var(--ink); margin:26px 0 0; opacity:.85}

/* ── 檢索欄 ── */
.controls{
  position:sticky; top:0; z-index:20; background:var(--surface);
  padding:14px 0 13px; margin-top:0;
  border-bottom:1px solid var(--rule);
  display:flex; flex-wrap:wrap; gap:9px; align-items:center;
}
.controls::before{
  content:""; position:absolute; inset:0 -40px; background:var(--surface);
  z-index:-1; border-bottom:1px solid var(--rule);
}
.search{flex:1 1 210px; min-width:170px; position:relative; display:flex; align-items:center}
.search input{
  width:100%; font:inherit; font-size:.95rem; color:var(--ink);
  background:var(--paper); border:1px solid var(--rule); border-radius:0;
  padding:8px 12px 8px 33px;
}
.search input::placeholder{color:var(--ink-faint)}
.search input:focus{outline:2px solid var(--indigo); outline-offset:1px}
.search svg{position:absolute; left:10px; width:15px; height:15px;
  stroke:var(--ink-faint); fill:none; stroke-width:1.8}
.tgl{
  font:inherit; font-size:.9rem; cursor:pointer; white-space:nowrap;
  background:var(--paper); color:var(--ink-soft);
  border:1px solid var(--rule); border-radius:0; padding:7px 14px;
  display:inline-flex; align-items:center; gap:7px; letter-spacing:.04em;
}
.tgl:hover{border-color:var(--indigo); color:var(--indigo)}
.tgl:focus-visible{outline:2px solid var(--indigo); outline-offset:1px}
.tgl[aria-pressed="true"]{background:var(--indigo); border-color:var(--indigo); color:var(--surface)}
.tgl .dot{width:6px; height:6px; background:currentColor; opacity:.45}
.tgl[aria-pressed="true"] .dot{opacity:1}

/* ── 分類目次 ── */
nav.cats{display:flex; flex-wrap:wrap; gap:5px; padding:15px 0 2px}
.chip{
  font:inherit; font-size:.87rem; cursor:pointer; letter-spacing:.03em;
  background:none; border:1px solid var(--rule-soft); border-radius:0;
  color:var(--ink-soft); padding:3px 11px; line-height:1.7;
}
.chip:hover{border-color:var(--indigo); color:var(--indigo)}
.chip:focus-visible{outline:2px solid var(--indigo); outline-offset:1px}
.chip[aria-pressed="true"]{
  background:var(--indigo-soft); border-color:var(--indigo);
  color:var(--indigo-deep); font-weight:700;
}

/* ── 卷首 ── */
section.cat{margin:44px 0 0; scroll-margin-top:74px}
.cat-head{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  border-bottom:1px solid var(--ink); padding-bottom:7px;
}
.cat-head h2{margin:0; font-size:1.34rem; font-weight:700; letter-spacing:.13em}
.cat-head .n{
  margin-left:auto; font-family:"Noto Sans","Segoe UI",Helvetica,Arial,sans-serif; font-size:.84rem;
  color:var(--ink-faint); font-variant-numeric:tabular-nums; letter-spacing:.05em;
}
.cat-desc{margin:7px 0 0; font-size:.88rem; color:var(--ink-faint)}

/* ── 詞條：左側界欄 ── */
ol.list{
  list-style:none; margin:6px 0 0; padding:0 0 0 17px;
  border-left:1px solid var(--rule-soft);
}
li.entry{
  display:grid; grid-template-columns:1fr auto; gap:0 14px;
  padding:13px 0 14px; border-bottom:1px dotted var(--rule-soft); position:relative;
}
li.entry::before{
  content:""; position:absolute; left:-18px; top:24px;
  width:9px; height:1px; background:var(--rule);
}
li.entry.known::before{background:var(--cinnabar); height:2px; top:23px}
.head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.head .w{font-size:1.3rem; font-weight:700; letter-spacing:.1em; line-height:1.5}
li.entry.known .head .w{color:var(--ink-faint)}
.head .py{
  font-family:"Noto Sans","Segoe UI",Helvetica,Arial,sans-serif;
  font-weight:500; font-size:.99rem; color:var(--indigo-deep);
  letter-spacing:.015em; line-height:1.5;
  font-feature-settings:"kern" 1; font-variant-ligatures:none;
}
.mean{grid-column:1/2; margin:2px 0 0; font-size:.99rem; color:var(--ink-soft)}
.note{
  grid-column:1/2; margin:6px 0 0; font-size:.87rem; color:var(--cinnabar);
  border-left:2px solid var(--cinnabar); padding-left:10px;
}
.note::before{content:"朱批　"; letter-spacing:.2em; opacity:.75}

/* 熟＝鈐印 */
.mark{
  grid-row:1/2; grid-column:2/3; align-self:center;
  width:30px; height:30px; flex:none; cursor:pointer; padding:0;
  background:none; border:1px dashed var(--rule); border-radius:0;
  color:var(--ink-faint); font-family:inherit; font-size:.86rem;
  line-height:1; display:grid; place-items:center; letter-spacing:0;
}
.mark:hover{border-style:solid; border-color:var(--cinnabar); color:var(--cinnabar)}
.mark:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
.mark[aria-pressed="true"]{
  background:var(--cinnabar); border:1px solid var(--cinnabar);
  color:var(--seal-ink); font-weight:700;
}

/* ── 遮蔽自測 ── */
body.masked .mean{
  color:transparent; background:var(--surface-2); cursor:pointer; user-select:none;
}
body.masked .mean::after{content:"　點此顯示釋義"; color:var(--ink-faint); font-size:.86rem}
body.masked .note{display:none}
body.masked .entry.revealed .mean{color:var(--ink-soft); background:none; cursor:auto; user-select:auto}
body.masked .entry.revealed .mean::after{content:""}
body.masked .entry.revealed .note{display:block}

.empty{padding:56px 0; text-align:center; color:var(--ink-faint); font-size:.95rem}
footer{
  margin:60px 0 0; padding-top:18px; border-top:1px solid var(--rule);
  font-size:.83rem; color:var(--ink-faint);
  display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap;
}

@media (max-width:560px){
  .wrap{padding:20px 12px 70px}
  .frame-in{padding:24px 20px 34px; margin:4px}
  .controls::before{inset:0 -20px}
  .seal{width:74px; height:74px; font-size:1.2rem}
  .head .w{font-size:1.2rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

</head>
<body>
<div class="wrap"><div class="frame"><div class="frame-in">

  <div class="controls">

  <main id="list"></main>

  <footer>
    <span>拼音採漢語拼音；異讀依教育部《重編國語辭典》台灣通行音。</span>
    <span>「熟」字鈐印為個人記錄，各自存於自己的瀏覽器，不與他人共用。</span>
  </footer>

</div></div></div>

<script>
const DATA = [{"cat": "一、時光流逝‧歲月", "desc": "感嘆光陰、季節與年歲的詞語", "items": [{"w": "殘春", "p": "cán chūn", "m": "暮春、晚春，春末夏初、春天將盡之時。古人以「殘紅」指落花，「殘春」則指春天最後的餘韻。", "n": ""}, {"w": "荏苒", "p": "rěn rǎn", "m": "時光漸漸過去、不知不覺流逝。多作「光陰荏苒」。", "n": ""}, {"w": "蹉跎", "p": "cuō tuó", "m": "虛度光陰、白白錯過時機；也指失意不得志。", "n": ""}, {"w": "駒光", "p": "jū guāng", "m": "駿馬奔馳如光閃而逝，比喻光陰過得極快。出自「白駒過隙」。", "n": ""}, {"w": "擲梭", "p": "zhí suō", "m": "織布的梭子往來不停，比喻時光飛逝。", "n": ""}, {"w": "躡影", "p": "niè yǐng", "m": "追踏影子，形容速度極快；也用來形容光陰迅疾。", "n": ""}, {"w": "頃歲", "p": "qǐng suì", "m": "近年來、這幾年。", "n": ""}, {"w": "鬢髮", "p": "bìn fà", "m": "兩鬢的頭髮。常用「鬢髮斑白」形容年歲已老。", "n": ""}, {"w": "曠日持久", "p": "kuàng rì chí jiǔ", "m": "事情被拖延很長時間卻毫無結果，白白耗費時日心力。", "n": ""}]}, {"cat": "二、勤學苦讀‧精進", "desc": "讀書、修習、積累與蓄養的詞語", "items": [{"w": "黃卷青燈", "p": "huáng juàn qīng dēng", "m": "燈光映照著書籍。形容深夜孤燈苦讀，或修行學佛的孤寂清苦生活。", "n": ""}, {"w": "繼晷", "p": "jì guǐ", "m": "接續日光，即夜以繼日；也指天黑點燈的時候。晷＝日影、日光。", "n": ""}, {"w": "焚膏繼晷", "p": "fén gāo jì guǐ", "m": "點燃燈燭來接替日光照明。形容夜以繼日地勤讀不怠或努力工作。", "n": ""}, {"w": "程門立雪", "p": "chéng mén lì xuě", "m": "楊時立於程頤門外雪中候教。比喻尊師重道、虔誠向學的精神。", "n": ""}, {"w": "治骨角者", "p": "zhì gǔ jiǎo zhě", "m": "治骨角須先切後磋。比喻修養學問要反覆雕琢、精益求精。語本《詩經‧衛風‧淇奧》「如切如磋」。", "n": ""}, {"w": "抖擻", "p": "dǒu sǒu", "m": "振作、奮發，使精神振起。如「精神抖擻」。", "n": ""}, {"w": "養精蓄銳", "p": "yǎng jīng xù ruì", "m": "保養精神、積蓄銳氣，以待時機而後動。", "n": ""}, {"w": "長足", "p": "cháng zú", "m": "形容進展迅速、幅度極大。如「長足的進步」「長足的發展」。", "n": ""}, {"w": "集腋成裘", "p": "jí yè chéng qiú", "m": "聚集許多狐腋的皮毛可縫成皮衣。比喻積少成多。", "n": ""}, {"w": "拼搏奮鬥", "p": "pīn bó fèn dòu", "m": "全力以赴地爭取、不懈努力地奮進。拼搏＝豁出全力去爭取。", "n": ""}]}, {"cat": "三、品德修養‧志節操守", "desc": "形容人格、氣節與奉獻精神的詞語", "items": [{"w": "高風亮節", "p": "gāo fēng liàng jié", "m": "形容人品德高尚，氣節堅貞。", "n": ""}, {"w": "韜光養晦", "p": "tāo guāng yǎng huì", "m": "隱藏才能與鋒芒，不使外露；也指修身養性、蟄伏待時。", "n": ""}, {"w": "高瞻遠矚", "p": "gāo zhān yuǎn zhǔ", "m": "站得高、看得遠。比喻眼光遠大，見識深遠。", "n": ""}, {"w": "碧血丹心", "p": "bì xuè dān xīn", "m": "形容滿腔正義的熱血與赤誠的忠心。", "n": ""}, {"w": "安貧樂道", "p": "ān pín lè dào", "m": "安於貧困的物質生活，而以堅持心中的理想、信念或道德為樂。", "n": "原檔作「安貧是樂」，通行成語為「安貧樂道」"}, {"w": "存誠閑邪", "p": "cún chéng xián xié", "m": "防止邪念滋生，以保存誠實之心。閑＝防閑、防止。", "n": ""}, {"w": "省察", "p": "xǐng chá", "m": "反省檢查自己的思想與行為。", "n": ""}, {"w": "篤", "p": "dǔ", "m": "忠實、專一、深厚；也有堅定、切實之意。如「篤信」「篤行」「篤志」。", "n": ""}, {"w": "熱忱", "p": "rè chén", "m": "熱烈而誠懇的心意、態度。", "n": ""}, {"w": "坦誠", "p": "tǎn chéng", "m": "坦白而誠懇，心中無所隱瞞。如「坦誠相待」。", "n": ""}, {"w": "克除", "p": "kè chú", "m": "克制並去除。多用於私慾、習氣、毛病，如「克除貪念」。", "n": ""}, {"w": "屹立不倒", "p": "yì lì bù dǎo", "m": "像山峰一樣高聳穩固，始終站立不搖。比喻意志堅定或事業歷經考驗而不動搖。屹＝山勢高聳挺立。", "n": ""}, {"w": "摩頂放踵", "p": "mó dǐng fàng zhǒng", "m": "從頭頂到腳跟都磨損受傷。形容不辭辛勞、全心全意為天下或他人奔波奉獻，不顧惜自己的身體。", "n": ""}, {"w": "櫛風沐雨", "p": "zhì fēng mù yǔ", "m": "以風梳髮、以雨洗身。比喻在外奔走，極為辛勞。", "n": ""}, {"w": "披星戴月", "p": "pī xīng dài yuè", "m": "頂著星月早出晚歸。形容日夜奔忙、辛勤勞苦。", "n": ""}, {"w": "不辭艱辛", "p": "bù cí jiān xīn", "m": "不推辭艱難辛苦，甘願承擔。", "n": ""}, {"w": "刎頸", "p": "wěn jǐng", "m": "用刀割脖子。多搭配成「刎頸之交」，比喻可以同生共死的至交好友。", "n": ""}, {"w": "痌瘝", "p": "tōng guān", "m": "體恤百姓的痛苦、憂心人民的疾苦。多作「痌瘝在抱」。", "n": ""}]}, {"cat": "四、言語‧口業‧論辯", "desc": "說話態度、口德與言辭效果的詞語", "items": [{"w": "三緘其口", "p": "sān jiān qí kǒu", "m": "嘴巴加了三道封條。形容說話極為謹慎，或閉口不言。", "n": ""}, {"w": "惟口起羞", "p": "wéi kǒu qǐ xiū", "m": "言語不慎，招致羞辱。近於「禍從口出」。", "n": ""}, {"w": "措辭切合", "p": "cuò cí qiè hé", "m": "措辭＝說話或行文時遣詞用字的行為與結果；切合＝符合、貼切。指用字遣詞恰如其分。", "n": ""}, {"w": "嚼舌", "p": "jiáo shé", "m": "搬弄是非、亂加議論；也指強詞奪理、無理狡辯。", "n": ""}, {"w": "辯駁", "p": "biàn bó", "m": "提出理由或根據來反駁對方的說法。", "n": ""}, {"w": "大吹法螺", "p": "dà chuī fǎ luó", "m": "原指佛教講經說法時吹奏法螺的儀式，今多比喻說大話、吹牛。", "n": ""}, {"w": "驕泰語", "p": "jiāo tài yǔ", "m": "傲慢放縱、目中無人的言語。", "n": "見《精撰》442"}, {"w": "鏗鏘有力", "p": "kēng qiāng yǒu lì", "m": "聲音響亮而有節奏；形容言辭堅定有力、擲地有聲。", "n": ""}, {"w": "振聾發聵", "p": "zhèn lóng fā kuì", "m": "比喻用強而有力的言論或文字，喚醒頭腦糊塗、麻木不仁的人，使他們清醒過來。", "n": ""}, {"w": "諶訓", "p": "chén xùn", "m": "誠懇明白的訓示。諶＝誠信、真誠。", "n": ""}, {"w": "郢書燕說", "p": "yǐng shū yān shuō", "m": "郢人書信誤書「舉燭」，燕相竟牽強解為尚賢。比喻穿鑿附會、曲解原意。", "n": ""}, {"w": "指名道姓", "p": "zhǐ míng dào xìng", "m": "直接點出對方的姓名來指稱或批評，毫不避諱、不留餘地。", "n": ""}, {"w": "繪聲繪影", "p": "huì shēng huì yǐng", "m": "形容講述或描摹事物時細緻入微、生動逼真，彷彿讓人身歷其境。", "n": "亦作「繪聲繪色」；今多帶有添油加醋、渲染誇張的意味"}, {"w": "揭發", "p": "jiē fā", "m": "把隱藏的壞事、內幕或真相公開揭露出來。", "n": ""}]}, {"cat": "五、過失‧改過‧責任", "desc": "談罪咎、悔改與擔當的詞語", "items": [{"w": "咎由自造", "p": "jiù yóu zì zào", "m": "所受的責備、懲罰或禍害全是自己造成的。同「咎由自取」。", "n": ""}, {"w": "愆尤", "p": "qiān yóu", "m": "過失、罪過。愆＝過失；尤＝過錯。", "n": ""}, {"w": "罪遣", "p": "zuì qiǎn", "m": "因罪而受到的譴責或貶謫責罰。亦作「罪譴」。", "n": ""}, {"w": "朝過夕改", "p": "zhāo guò xī gǎi", "m": "早上犯了過錯，晚上就改正。形容勇於改過、毫不遲延。", "n": "原檔作「朝過改該」，應為筆誤"}, {"w": "推諉", "p": "tuī wěi", "m": "找藉口推托、不負責任，把工作或過錯推卸給別人。", "n": ""}, {"w": "玩忽", "p": "wán hū", "m": "輕忽、不當一回事、不加注意。如「玩忽職守」。", "n": ""}, {"w": "自甘墮落", "p": "zì gān duò luò", "m": "自己甘願往下沉淪，不求上進。", "n": ""}, {"w": "措意", "p": "cuò yì", "m": "留意、留心、放在心上。", "n": ""}, {"w": "錯怪", "p": "cuò guài", "m": "因誤會而責備了不該責備的人。", "n": ""}, {"w": "欲蓋彌彰", "p": "yù gài mí zhāng", "m": "想掩蓋壞事或過失的真相，結果反而使它暴露得更加明顯。彌＝更加；彰＝顯明。", "n": "語本《左傳‧昭公三十一年》"}, {"w": "瑕玷", "p": "xiá diàn", "m": "玉上的斑點。比喻缺點、過失，或名譽上的污損。", "n": ""}, {"w": "污垢", "p": "wū gòu", "m": "積存的髒東西；也比喻心性上的染污與惡習。", "n": ""}, {"w": "肩負", "p": "jiān fù", "m": "用肩膀擔起；引申為承擔起責任、使命或重任。", "n": ""}, {"w": "大逆不道", "p": "dà nì bù dào", "m": "嚴重違背君臣倫常與道義。原為古代重罪之名，今泛指極端叛逆、罪大惡極的言行。", "n": ""}]}, {"cat": "六、負面性情‧行為", "desc": "描寫不良品性、習氣與壓制阻撓的詞語", "items": [{"w": "貪婪", "p": "tān lán", "m": "貪得無厭、不知滿足。", "n": ""}, {"w": "乖戾", "p": "guāi lì", "m": "性情、言語或行為彆扭暴躁、不合情理；也指事物之間不和諧、不一致。", "n": ""}, {"w": "獪形", "p": "kuài xíng", "m": "指人聰明而狡猾、詭詐多變；亦有頑皮戲耍之意。獪＝狡猾。", "n": ""}, {"w": "頹放", "p": "tuí fàng", "m": "頹廢放縱、不拘禮法；也指疏略怠慢。", "n": ""}, {"w": "窳惰", "p": "yǔ duò", "m": "懶惰、懈怠、怠惰不振。窳本身即有懶惰、粗劣之意。", "n": ""}, {"w": "浮華", "p": "fú huá", "m": "只重表面的華麗排場而缺乏實質內涵。", "n": ""}, {"w": "奢求", "p": "shē qiú", "m": "過分的要求、不切實際的期望。", "n": ""}, {"w": "騷擾", "p": "sāo rǎo", "m": "擾亂、使人不得安寧。", "n": ""}, {"w": "箝制", "p": "qián zhì", "m": "用強力、威勢或權力去壓制、控制、約束他人，使其無法自由行動或發言。亦作「鉗制」。", "n": ""}, {"w": "掣肘／掣牽", "p": "chè zhǒu／chè qiān", "m": "拉住手肘。比喻從旁牽制阻撓，使人不能放手去做。", "n": ""}, {"w": "壓抑", "p": "yā yì", "m": "對感情、慾望或力量加以壓制而不使表露；也形容氣氛沉悶、令人透不過氣。", "n": ""}, {"w": "裙帶關係", "p": "qún dài guān xì", "m": "指掌權者因親屬或姻親關係，在工作、升遷、政治任命或資源分配上偏袒自己人，也稱為任人唯親。", "n": "此詞最初指男子靠妻子或女性親屬的關係取得官職與利益"}, {"w": "歧視", "p": "qí shì", "m": "以不平等的眼光看待他人，因種族、性別、身分等因素而輕視、差別對待。", "n": ""}, {"w": "濫墾濫伐", "p": "làn kěn làn fá", "m": "違反法規、過度而不當地開墾土地與砍伐森林。多指未取得合法許可、超出砍伐限額，或破壞山坡地與自然保育區的行為。", "n": ""}]}, {"cat": "七、戰亂‧太平‧同心", "desc": "兵事、止戈與盛世安寧的詞語", "items": [{"w": "干戈", "p": "gān gē", "m": "1. 泛指武器。2. 比喻兵事、戰亂。", "n": ""}, {"w": "干戈載戢", "p": "gān gē zài jí", "m": "載戢＝收藏存放。比喻戰事停止平息，不再訴諸武力。", "n": "原檔作「干戈載輯」，正字為「戢」"}, {"w": "倒置干戈", "p": "dào zhì gān gē", "m": "把兵器倒過來收起，不再打仗。指天下太平。", "n": ""}, {"w": "鴻均", "p": "hóng jūn", "m": "亦作「鴻鈞」。三義：1. 天下太平的盛世。2. 自然運轉的造化。3. 神話中的至高神。", "n": ""}, {"w": "無疆", "p": "wú jiāng", "m": "沒有窮盡、無限。如「萬壽無疆」。", "n": ""}, {"w": "攜手", "p": "xié shǒu", "m": "手拉著手；比喻同心協力、共同進行。", "n": ""}, {"w": "顛覆", "p": "diān fù", "m": "翻倒、推翻。多指以非常手段推翻政權或既有秩序；今也指徹底改變原有的認知與做法。", "n": ""}, {"w": "狙擊", "p": "jū jí", "m": "埋伏在隱蔽處伺機襲擊；今多指狙擊手的遠距離射殺。狙＝伺伏窺伺。", "n": ""}, {"w": "分出勝負", "p": "fēn chū shèng fù", "m": "較量到底，分辨出誰勝誰敗。", "n": ""}]}, {"cat": "八、佛道‧修行用語", "desc": "佛堂、佛學與命理相關的專門語彙", "items": [{"w": "涅槃", "p": "niè pán", "m": "梵語音譯。指滅除一切煩惱、超脫生死輪迴的圓滿寂靜境界；亦用作高僧圓寂的敬稱。", "n": ""}, {"w": "利衰苦樂", "p": "lì shuāi kǔ lè", "m": "佛教「八風」（稱、譏、毀、譽、利、衰、苦、樂）中的四種世俗境界，指生活中利益、衰耗、痛苦與快樂的遭遇。", "n": ""}, {"w": "蓋纏", "p": "gài chán", "m": "煩惱的別名。蓋＝覆蔽善心，纏＝纏縛身心，皆令人不得解脫。", "n": ""}, {"w": "雁宇", "p": "yàn yǔ", "m": "佛堂的意思。", "n": "一貫道／佛堂用語"}, {"w": "絕智", "p": "jué zhì", "m": "智慧的斷絕與閉塞。", "n": ""}, {"w": "梵唄", "p": "fàn bài", "m": "佛教傳統的唱誦音樂，用以歌頌三寶（佛、法、僧）功德、諷誦經文並調柔身心的神聖音聲。唄＝梵語 bhāṣā 的略譯，讚頌之意。", "n": ""}, {"w": "順剋", "p": "shùn kè", "m": "五行與命理學中，指正常的、依序而行的五行相剋關係。", "n": ""}, {"w": "趨吉避凶", "p": "qū jí bì xiōng", "m": "趨向吉祥、避開災禍。", "n": ""}, {"w": "寤寐", "p": "wù mèi", "m": "醒著和睡著，引申為日夜、時時刻刻。寤＝睡醒；寐＝入睡。", "n": ""}, {"w": "罡風", "p": "gāng fēng", "m": "道教指高空極猛烈的風；比喻險惡的環境或強大的外力。", "n": ""}, {"w": "玄黃", "p": "xuán huáng", "m": "天玄地黃，代指天地；也指黑色與黃色的絲帛、幣帛。", "n": ""}, {"w": "寰宇", "p": "huán yǔ", "m": "整個天下、全世界。", "n": ""}, {"w": "霑霈", "p": "zhān pèi", "m": "受到雨露般的滋潤。比喻普受恩澤。", "n": ""}, {"w": "賚", "p": "lài", "m": "賞賜、賜予、贈送。", "n": ""}]}, {"cat": "九、情緒‧心境", "desc": "描寫內心感受與轉念的詞語", "items": [{"w": "惆悵", "p": "chóu chàng", "m": "因失意、失望而引起的傷感、愁悶或迷茫。", "n": ""}, {"w": "拂意", "p": "fú yì", "m": "不合心意、不如意；也指違背他人的意願。", "n": ""}, {"w": "衎凱", "p": "kàn kǎi", "m": "歡喜、開心。衎＝和樂；凱＝歡樂。", "n": ""}, {"w": "幡然", "p": "fān rán", "m": "迅速而徹底地轉變。多作「幡然悔悟」「幡然改圖」。", "n": ""}, {"w": "笑靨", "p": "xiào yè", "m": "笑時臉頰上顯現的酒窩；泛指笑容。", "n": ""}, {"w": "激發", "p": "jī fā", "m": "刺激而使奮起，使潛藏的力量、志氣或情感發動出來。如「激發潛能」。", "n": "與「激動」對看：激發多為使他人或潛力振起，激動則指自身情緒起伏"}, {"w": "激動", "p": "jī dòng", "m": "情緒因受刺激而起伏強烈、難以平靜。", "n": ""}, {"w": "憤慨", "p": "fèn kǎi", "m": "憤怒而激動、氣憤不平；亦有憤怒而慨嘆之意。", "n": ""}, {"w": "慚愧", "p": "cán kuì", "m": "因自己有過失或有負於人而感到羞愧不安。", "n": ""}, {"w": "訝異", "p": "yà yì", "m": "驚訝詫異、感到意外。", "n": ""}, {"w": "錯愕", "p": "cuò è", "m": "事出突然而驚訝發愣，一時反應不過來。", "n": ""}, {"w": "愁霾", "p": "chóu mái", "m": "形容如煙霧般籠罩著的憂愁與壓抑氣氛；也指令人心情沉重、昏暗的環境與心境。霾＝空中懸浮塵土而昏暗。", "n": ""}, {"w": "槁木死灰", "p": "gǎo mù sǐ huī", "m": "枯乾的樹木與冷卻的灰燼。比喻人因遭受重大挫折或變故而灰心絕望、意志消沉，對外界事物無動於衷。", "n": "語本《莊子‧齊物論》，原指形神俱寂的修道境界，今多用其消沉義"}, {"w": "戚戚焉", "p": "qī qī yān", "m": "多作「心有戚戚焉」，指心中深受觸動、頗有同感。戚戚＝內心動容的樣子。語本《孟子‧梁惠王上》「夫子言之，於我心有戚戚焉」。", "n": ""}, {"w": "謬思狂態", "p": "miù sī kuáng tài", "m": "形容藝術家文思泉湧、靈感爆發時，所展現出近乎瘋狂、極度投入而不拘世俗常規的精神狀態。", "n": "「謬思」即繆思（Muse），希臘神話中的文藝女神"}]}, {"cat": "十、困境‧艱難‧虛妄", "desc": "形容處境窘迫、阻滯與不實的詞語", "items": [{"w": "胠沙思水", "p": "qū shā sī shuǐ", "m": "魚受阻於沙灘才想到水。比喻悔悟太遲、來不及挽救。", "n": ""}, {"w": "倒懸", "p": "dào xuán", "m": "頭下腳上地被吊著。比喻處境極為艱困危急，如「解民倒懸」。", "n": ""}, {"w": "濘沼", "p": "nìng zhǎo", "m": "泥濘的濕地、沼澤或積水很深的泥坑；比喻艱難而不易脫身的困境。", "n": "亦常寫作「泥沼」"}, {"w": "貧瘠", "p": "pín jí", "m": "土地不肥沃、缺乏養分；也形容內容空乏。", "n": ""}, {"w": "逡巡", "p": "qūn xún", "m": "有所顧慮而徘徊不前、遲疑退卻。", "n": ""}, {"w": "藩籬", "p": "fán lí", "m": "1. 用柴竹編成的屏蔽圍牆，引申為保護防衛。2. 範圍、界限。", "n": ""}, {"w": "關礙", "p": "guān ài", "m": "阻礙、干擾、妨礙。", "n": ""}, {"w": "所生枝節", "p": "suǒ shēng zhī jié", "m": "節外生枝而招惹出來的麻煩事端。", "n": ""}, {"w": "殄沌", "p": "tiǎn dùn", "m": "雜亂無序、模糊不清、沒有條理的樣子。", "n": ""}, {"w": "繁冗", "p": "fán rǒng", "m": "繁瑣冗長或事務繁多。指文字、流程或事情過於複雜，以致浪費時間、增加負擔。", "n": ""}, {"w": "紛雜", "p": "fēn zá", "m": "繁多而雜亂，頭緒紛紜不易理清。", "n": ""}, {"w": "離奇", "p": "lí qí", "m": "不合常理、出人意料，奇特曲折而難以理解。", "n": ""}, {"w": "萎縮", "p": "wěi suō", "m": "枯萎收縮；引申為衰退、減弱。", "n": ""}, {"w": "侵蝕", "p": "qīn shí", "m": "逐漸損壞、消耗、腐蝕。", "n": ""}, {"w": "救援", "p": "jiù yuán", "m": "援助解救陷於危難的人。", "n": ""}, {"w": "海市蜃樓", "p": "hǎi shì shèn lóu", "m": "光線折射造成的虛幻景象。比喻虛幻不實的事物或空想。", "n": ""}]}, {"cat": "十一、處事智慧‧謀略", "desc": "談決斷、時機與待人分寸的詞語", "items": [{"w": "因時制宜", "p": "yīn shí zhì yí", "m": "根據不同時期的情況，採取合宜的措施應對。", "n": ""}, {"w": "操刀必割", "p": "cāo dāo bì gē", "m": "拿起刀就一定要下手切割。比喻辦事必須果斷及時，抓住時機，決不猶豫。", "n": ""}, {"w": "以珠彈雀", "p": "yǐ zhū tán què", "m": "拿珍珠去打麻雀。比喻行事輕重倒置，得不償失、划不來。", "n": ""}, {"w": "喫飯防噎", "p": "chī fàn fáng yē", "m": "吃飯也要防著噎住。比喻做事謹慎小心、戒慎恐懼，凡事都要預防可能的意外。", "n": ""}, {"w": "抉擇", "p": "jué zé", "m": "挑選決定；在多者之間作出選擇。", "n": ""}, {"w": "釐清", "p": "lí qīng", "m": "整理清楚、辨明分際。", "n": ""}, {"w": "識透", "p": "shí tòu", "m": "看穿、認識得徹底，不被表象所蒙蔽。如「識透世情」。", "n": ""}, {"w": "卻之不恭", "p": "què zhī bù gōng", "m": "本指拒絕別人的邀請或贈予是不恭敬的。後多用作接受他人饋贈或邀請時的客氣話。", "n": ""}, {"w": "鴻猷", "p": "hóng yóu", "m": "宏大的謀略，或遠大的事業、功業。", "n": ""}, {"w": "一夕超遷", "p": "yī xì chāo qiān", "m": "超遷＝越級升遷。指官吏不依正常次序，一夜之間跳級提升職位。", "n": ""}, {"w": "扶搖直上", "p": "fú yáo zhí shàng", "m": "乘旋風盤旋而上。形容事物、地位或名聲迅速上升，也比喻仕途得意。", "n": ""}]}, {"cat": "十二、才德‧人物‧身分", "desc": "指稱人才、美質與身分的詞語", "items": [{"w": "時彥", "p": "shí yàn", "m": "當代的俊傑、賢才或名流。時＝當時代；彥＝才德出眾的人。", "n": ""}, {"w": "琇玞", "p": "xiù fū", "m": "琇＝像玉一樣的美石，常用來形容人品德高尚、純潔溫潤，或長相俊秀；玞亦指似玉的美石。合稱給人溫潤如玉、高潔典雅、才華出眾之感。", "n": ""}, {"w": "珷玞", "p": "wǔ fū", "m": "一種像玉的石頭（美石，次於玉）。雖然好看，卻不是真正的美玉，常用以喻似是而非之物。", "n": "亦作「碔砆」「碔玞」"}, {"w": "奴僕", "p": "nú pú", "m": "供人役使的僕人；引申為受人驅遣、無自主之人。", "n": ""}]}, {"cat": "十三、景物‧器物‧意象", "desc": "寫景、狀物與描摹形貌的詞語", "items": [{"w": "丹桂", "p": "dān guì", "m": "開橘紅或深黃色花的桂花樹（或其花）。常作修飾語，用來形容秋景、香氣，或比喻科考高中（如「丹桂飄香」「蟾宮折桂」）。", "n": ""}, {"w": "煮茗", "p": "zhǔ míng", "m": "煮茶。茗＝茶。多見於閒適清雅的文人意境。", "n": ""}, {"w": "蓴羹鱸膾", "p": "chún gēng lú kuài", "m": "張翰因思念家鄉蓴菜羹與鱸魚膾而辭官還鄉。比喻思鄉歸隱之情。", "n": ""}, {"w": "映照", "p": "yìng zhào", "m": "光線照射而相互輝映。", "n": ""}, {"w": "遙望／眺望", "p": "yáo wàng／tiào wàng", "m": "遙望＝從遠處向某方向看；眺望＝登高向遠處看。二者近義，眺望多含「登高」之意。", "n": ""}, {"w": "飄飄灑灑", "p": "piāo piāo sǎ sǎ", "m": "形容雪、花、雨等輕輕飄落散布的樣子；也形容瀟灑自在的神態。", "n": ""}, {"w": "堂皇富麗", "p": "táng huáng fù lì", "m": "形容建築或陳設氣派宏大、華美壯麗。即「富麗堂皇」。", "n": ""}, {"w": "一覽無遺", "p": "yī lǎn wú yí", "m": "一眼望去全部看盡，毫無遺漏。", "n": ""}, {"w": "深邃", "p": "shēn suì", "m": "1. 幽深深遠，如庭院深邃、夜色深邃。2. 形容思想、學問精深難測。邃＝深遠。", "n": ""}, {"w": "充盈", "p": "chōng yíng", "m": "充滿、飽滿豐足。如「元氣充盈」「淚水充盈眼眶」。", "n": ""}, {"w": "霄壤矞變", "p": "xiāo rǎng yù biàn", "m": "霄＝天，壤＝地，矞＝奇異。指天地之間發生奇特、巨大、翻天覆地的變化。", "n": ""}, {"w": "連遱", "p": "lián lóu", "m": "接連不斷、相連不絕的樣子。", "n": ""}, {"w": "鯫", "p": "zōu", "m": "小魚。引申形容細小、卑微，如「鯫生」為自謙之詞。", "n": ""}, {"w": "茁壯", "p": "zhuó zhuàng", "m": "植物或人成長得健壯茂盛。", "n": ""}, {"w": "殘骸", "p": "cán hái", "m": "殘留的屍骨；也指毀壞後遺留的殘破物體，如「飛機殘骸」。", "n": ""}, {"w": "無疴", "p": "wú kē", "m": "沒有疾病、身體健康、無病無痛。疴＝疾病。", "n": ""}, {"w": "夷瘳", "p": "yí chōu", "m": "疾病平復、痊癒。夷＝平；瘳＝病癒。", "n": ""}, {"w": "儻來", "p": "tǎng lái", "m": "意外忽然到來、非分而得。如「儻來之物」。", "n": ""}]}, {"cat": "十四、日常動作‧行為", "desc": "泛用的動詞與行為描述", "items": [{"w": "犒賞", "p": "kào shǎng", "m": "用酒食財物慰勞獎賞有功的人。", "n": ""}, {"w": "狩獵", "p": "shòu liè", "m": "打獵。狩本指冬獵，泛指捕獵禽獸。", "n": ""}, {"w": "涉足", "p": "shè zú", "m": "進入某一特定的環境、範圍或領域。", "n": ""}, {"w": "招攬", "p": "zhāo lǎn", "m": "招引、攬納，設法把人或生意吸引過來。", "n": ""}, {"w": "鋪陳", "p": "pū chén", "m": "1. 鋪設陳列。2. 詳細地敘述、鋪敘展開（文章寫作手法）。", "n": ""}, {"w": "倣效", "p": "fǎng xiào", "m": "依照別人的方法、樣式或精神來模仿、效法。同「仿效」。", "n": ""}, {"w": "述遵", "p": "shù zūn", "m": "遵循、遵照執行前人所述。", "n": ""}, {"w": "承襲傳統", "p": "chéng xí chuán tǒng", "m": "承接沿襲前人的智慧、技藝、精神或文化，並加以傳承下去。", "n": ""}, {"w": "管保", "p": "guǎn bǎo", "m": "保證、包管，一定如此。", "n": ""}, {"w": "棐", "p": "fěi", "m": "本義為矯正弓弩的器具，引申為輔助、輔導。", "n": ""}, {"w": "塑造形象", "p": "sù zào xíng xiàng", "m": "以言語、作為或文藝手法，建立起某人某物在他人心中的樣貌與評價。塑造＝用泥土等材料捏製成形，引申為刻意營造。", "n": ""}, {"w": "安撫", "p": "ān fǔ", "m": "安慰撫慰，使人心情平定、情緒安穩。", "n": ""}, {"w": "推薦", "p": "tuī jiàn", "m": "介紹好的人或事物，希望對方採用、任用或接受。", "n": ""}, {"w": "依托", "p": "yī tuō", "m": "依靠、憑藉；也指假託某種名義。", "n": "亦作「依託」"}]}, {"cat": "十五、字形辨析（繁體／異體）", "desc": "容易混用的正字、異體字與兩岸用字差異", "items": [{"w": "艷／豔", "p": "yàn", "m": "「艷」為「豔」的異體字，二字同義，指色彩鮮明華美。台灣正體多作「豔」。", "n": ""}, {"w": "審", "p": "shěn", "m": "「审」的繁體字。詳細考察、仔細分辨，如「審察」「審慎」。", "n": ""}, {"w": "汙／污", "p": "wū", "m": "「汙」為「污」的異體，二字通用。「汙染」＝「污染」。", "n": ""}, {"w": "抽菸", "p": "chōu yān", "m": "吸食香菸。「菸」為台灣通行用字，中國大陸多作「抽烟」。", "n": ""}, {"w": "老闆", "p": "lǎo bǎn", "m": "商店或企業的主人、僱主。「闆」為繁體正字，簡體作「板」。", "n": ""}]}, {"cat": "十六、現代常用語‧泛用詞", "desc": "現代通行的日常、新聞與醫療用語及一般名物", "items": [{"w": "顯然", "p": "xiǎn rán", "m": "事情明顯清楚，一看便知、不待多說。", "n": ""}, {"w": "階段", "p": "jiē duàn", "m": "事物發展過程中所劃分出來的段落、時期。", "n": ""}, {"w": "基礎", "p": "jī chǔ", "m": "建築物的根腳；引申為事物賴以成立的根本、根基。", "n": ""}, {"w": "持續", "p": "chí xù", "m": "連續不斷地保持下去。", "n": ""}, {"w": "切割", "p": "qiē gē", "m": "1. 用刀具割開、分離。2. 引申為劃清界線、撇清關係（如「與某人切割」）。", "n": ""}, {"w": "貫穿", "p": "guàn chuān", "m": "1. 穿透而過。2. 從頭到尾連貫串接，如「貫穿全文的主旨」。", "n": ""}, {"w": "抽搐", "p": "chōu chù", "m": "肌肉不自主地急速收縮抖動，即抽筋、痙攣。", "n": ""}, {"w": "胰島素", "p": "yí dǎo sù", "m": "胰臟中胰島細胞分泌的荷爾蒙，能促使血糖進入細胞、降低血糖濃度，為糖尿病治療的重要藥物。", "n": ""}, {"w": "陀螺", "p": "tuó luó", "m": "上圓下尖、以繩抽轉的旋轉童玩。常以「像陀螺一樣轉個不停」比喻忙碌不休。", "n": ""}, {"w": "調羹", "p": "tiáo gēng", "m": "湯匙。本義為調和羹湯，古時亦借指宰相輔佐治國之事（如「和羹調鼎」）。", "n": ""}]}];
const $ = s => document.querySelector(s);
const listRoot = $('#list');
const state = { q:'', cat:'all', masked:false, onlyUnknown:false, marks:{} };
const KEY = 'shengci-marks';


function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function render(){
  const q = state.q.trim().toLowerCase();
  let shown = 0;
  const parts = DATA.map((c, ci) => {
    const items = c.items.filter(it => {
      if (state.cat !== 'all' && state.cat !== String(ci)) return false;
      if (state.onlyUnknown && state.marks[it.w]) return false;
      if (!q) return true;
      return (it.w + it.p + it.m + it.n).toLowerCase().includes(q);
    });
    if (!items.length) return '';
    shown += items.length;
    return `<section class="cat" id="c${ci}">
      <div class="cat-head"><h2>${esc(c.cat)}</h2><span class="n">${items.length} 詞</span></div>
      <p class="cat-desc">${esc(c.desc)}</p>
      <ol class="list">${items.map(it => `
        <li class="entry${state.marks[it.w]?' known':''}" data-w="${esc(it.w)}">
          <div class="head"><span class="w">${esc(it.w)}</span><span class="py">${esc(it.p)}</span></div>
          <button class="mark" type="button" aria-pressed="${!!state.marks[it.w]}"
            title="鈐印表示已熟" aria-label="標記「${esc(it.w)}」為已熟">熟</button>
          <p class="mean">${esc(it.m)}</p>
          ${it.n ? `<p class="note">${esc(it.n)}</p>` : ''}
        </li>`).join('')}</ol>
    </section>`;
  });
  listRoot.innerHTML = parts.join('') || `<p class="empty">未見「${esc(state.q)}」相關詞條。</p>`;
  $('#shown').textContent = shown;
}

$('#q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('#mask').addEventListener('click', e => {
  state.masked = !state.masked;
  e.currentTarget.setAttribute('aria-pressed', state.masked);
  document.body.classList.toggle('masked', state.masked);
});
$('#unknown').addEventListener('click', e => {
  state.onlyUnknown = !state.onlyUnknown;
  e.currentTarget.setAttribute('aria-pressed', state.onlyUnknown);
  render();
});
document.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
  state.cat = ch.dataset.cat;
  document.querySelectorAll('.chip').forEach(o => o.setAttribute('aria-pressed', o === ch));
  render();
  if (state.cat !== 'all') window.scrollTo({top:0});
}));

listRoot.addEventListener('click', e => {
  const btn = e.target.closest('.mark');
  if (btn){
    const li = btn.closest('.entry'), w = li.dataset.w;
    if (state.marks[w]) delete state.marks[w]; else state.marks[w] = 1;
    btn.setAttribute('aria-pressed', !!state.marks[w]);
    li.classList.toggle('known', !!state.marks[w]);
    updateCount(); saveMarks();
    if (state.onlyUnknown) render();
    return;
  }
  if (state.masked){
    const li = e.target.closest('.entry');
    if (li) li.classList.toggle('revealed');
  }
});

function updateCount(){ $('#known').textContent = Object.keys(state.marks).length; }

/* 獨立網站版：標記只存於自己的瀏覽器 localStorage。 */
function saveMarks(){
  try{ localStorage.setItem(KEY, JSON.stringify(state.marks)); }catch(e){}
}

try{ const c = localStorage.getItem(KEY); if (c) state.marks = JSON.parse(c) || {}; }catch(e){}

render(); updateCount();

(function(){
  const root = document.documentElement, btn = $('#theme'), lbl = $('#themelbl'), TK = 'shengci-theme';
  const prefersDark = () => window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  function apply(t){
    if (t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
    const dark = t === 'dark' || (!t && prefersDark());
    btn.setAttribute('aria-pressed', dark);
    lbl.textContent = dark ? '明' : '暗';
    btn.setAttribute('aria-label', dark ? '切換為明亮版面' : '切換為暗色版面');
  }
  let saved = null; try{ saved = localStorage.getItem(TK); }catch(e){}
  apply(saved);
  btn.addEventListener('click', () => {
    const dark = root.getAttribute('data-theme') === 'dark' ||
                 (!root.hasAttribute('data-theme') && prefersDark());
    const t = dark ? 'light' : 'dark';
    try{ localStorage.setItem(TK, t); }catch(e){}
    apply(t);
  });
})();


</script>

</body>
</html>
