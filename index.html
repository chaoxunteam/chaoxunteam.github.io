<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="生詞集解 — 195 詞條，16 類，附拼音與釋義。">
<meta name="color-scheme" content="light dark">
<title>生詞集解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&family=Noto+Sans:wght@400;500;600&display=swap">
<style>
/* 宣紙・靛藍・硃砂 ── 線裝書意象 */
:root{
  --paper:#e9e2d3; --surface:#f3ede1; --surface-2:#ded5c0;
  --ink:#2b241b; --ink-soft:#5f5546; --ink-faint:#8d8271;
  --rule:#c9bda3; --rule-soft:#d9cfb8;
  --indigo:#274a72; --indigo-deep:#1c3757; --indigo-soft:#d6dde7;
  --cinnabar:#a8342a; --cinnabar-soft:#ead7d2;
  --seal-ink:#f3ede1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14110d; --surface:#1d1913; --surface-2:#2a241b;
    --ink:#e7ddc8; --ink-soft:#a5977f; --ink-faint:#7a6e5c;
    --rule:#3a3327; --rule-soft:#2c261d;
    --indigo:#8fb4dc; --indigo-deep:#a8c7e8; --indigo-soft:#1d2836;
    --cinnabar:#d9705f; --cinnabar-soft:#2e1c18;
    --seal-ink:#14110d;
  }
}
:root[data-theme="dark"]{
  --paper:#14110d; --surface:#1d1913; --surface-2:#2a241b;
  --ink:#e7ddc8; --ink-soft:#a5977f; --ink-faint:#7a6e5c;
  --rule:#3a3327; --rule-soft:#2c261d;
  --indigo:#8fb4dc; --indigo-deep:#a8c7e8; --indigo-soft:#1d2836;
  --cinnabar:#d9705f; --cinnabar-soft:#2e1c18;
  --seal-ink:#14110d;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper)}
body{
  margin:0; color:var(--ink);
  background:var(--paper);
  /* 宣紙纖維：極淡的交錯紋理 */
  background-image:
    repeating-linear-gradient(102deg, rgba(120,100,60,.030) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(11deg,  rgba(120,100,60,.022) 0 1px, transparent 1px 11px);
  font-family:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",'標楷體',"KaiTi",
              "Noto Serif TC","PMingLiU",serif;
  font-size:17px; line-height:1.95;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body{background-image:
    repeating-linear-gradient(102deg, rgba(220,200,150,.026) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(11deg,  rgba(220,200,150,.018) 0 1px, transparent 1px 11px);}
}
:root[data-theme="dark"] body{background-image:
  repeating-linear-gradient(102deg, rgba(220,200,150,.026) 0 1px, transparent 1px 7px),
  repeating-linear-gradient(11deg,  rgba(220,200,150,.018) 0 1px, transparent 1px 11px);}

.wrap{max-width:900px; margin:0 auto; padding:34px 20px 90px}

/* ── 版框：外粗內細雙欄框 ── */
.frame{
  border:3px double var(--ink); padding:0;
  background:linear-gradient(var(--surface),var(--surface));
  background-clip:padding-box;
}
.frame-in{border:1px solid var(--rule); margin:5px; padding:34px 40px 46px}

/* ── 書名頁 ── */
header.top{display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap}
.seal{
  flex:none; width:96px; height:96px; background:var(--cinnabar);
  display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
  place-items:center; color:var(--seal-ink); font-size:1.55rem; font-weight:700;
  line-height:1; box-shadow:inset 0 0 0 3px var(--cinnabar);
}
.seal span{transform:translateY(1px)}
.title-block{flex:1 1 320px; min-width:250px}
.eyebrow{
  margin:0 0 6px; font-family:"Noto Sans","Segoe UI",Helvetica,Arial,sans-serif;
  font-size:.85rem; letter-spacing:.16em; color:var(--ink-faint);
}
h1{
  margin:0; font-size:clamp(2.3rem,6vw,3.1rem); font-weight:700;
  letter-spacing:.16em; line-height:1.25; text-wrap:balance;
}
.lede{margin:12px 0 0; max-width:58ch; color:var(--ink-soft); font-size:.98rem}
.stats{
  display:flex; flex-wrap:wrap; gap:4px 24px; margin:18px 0 0;
  font-size:.86rem; color:var(--ink-faint); font-variant-numeric:tabular-nums;
}
.stats b{color:var(--indigo); font-weight:700; font-size:1.02rem}
hr.rule{border:0; border-top:1px solid var(--ink); margin:26px 0 0; opacity:.85}

/* ── 檢索欄 ── */
.controls{
  position:sticky; top:0; z-index:20; background:var(--surface);
  padding:14px 0 13px; margin-top:0;
  border-bottom:1px solid var(--rule);
  display:flex; flex-wrap:wrap; gap:9px; align-items:center;
}
.controls::before{
  content:""; position:absolute; inset:0 -40px; background:var(--surface);
  z-index:-1; border-bottom:1px solid var(--rule);
}
.search{flex:1 1 210px; min-width:170px; position:relative; display:flex; align-items:center}
.search input{
  width:100%; font:inherit; font-size:.95rem; color:var(--ink);
  background:var(--paper); border:1px solid var(--rule); border-radius:0;
  padding:8px 12px 8px 33px;
}
.search input::placeholder{color:var(--ink-faint)}
.search input:focus{outline:2px solid var(--indigo); outline-offset:1px}
.search svg{position:absolute; left:10px; width:15px; height:15px;
  stroke:var(--ink-faint); fill:none; stroke-width:1.8}
.tgl{
  font:inherit; font-size:.9rem; cursor:pointer; white-space:nowrap;
  background:var(--paper); color:var(--ink-soft);
  border:1px solid var(--rule); border-radius:0; padding:7px 14px;
  display:inline-flex; align-items:center; gap:7px; letter-spacing:.04em;
}
.tgl:hover{border-color:var(--indigo); color:var(--indigo)}
.tgl:focus-visible{outline:2px solid var(--indigo); outline-offset:1px}
.tgl[aria-pressed="true"]{background:var(--indigo); border-color:var(--indigo); color:var(--surface)}
.tgl .dot{width:6px; height:6px; background:currentColor; opacity:.45}
.tgl[aria-pressed="true"] .dot{opacity:1}

/* ── 分類目次 ── */
nav.cats{display:flex; flex-wrap:wrap; gap:5px; padding:15px 0 2px}
.chip{
  font:inherit; font-size:.87rem; cursor:pointer; letter-spacing:.03em;
  background:none; border:1px solid var(--rule-soft); border-radius:0;
  color:var(--ink-soft); padding:3px 11px; line-height:1.7;
}
.chip:hover{border-color:var(--indigo); color:var(--indigo)}
.chip:focus-visible{outline:2px solid var(--indigo); outline-offset:1px}
.chip[aria-pressed="true"]{
  background:var(--indigo-soft); border-color:var(--indigo);
  color:var(--indigo-deep); font-weight:700;
}

/* ── 卷首 ── */
section.cat{margin:44px 0 0; scroll-margin-top:74px}
.cat-head{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  border-bottom:1px solid var(--ink); padding-bottom:7px;
}
.cat-head h2{margin:0; font-size:1.34rem; font-weight:700; letter-spacing:.13em}
.cat-head .n{
  margin-left:auto; font-family:"Noto Sans","Segoe UI",Helvetica,Arial,sans-serif; font-size:.84rem;
  color:var(--ink-faint); font-variant-numeric:tabular-nums; letter-spacing:.05em;
}
.cat-desc{margin:7px 0 0; font-size:.88rem; color:var(--ink-faint)}

/* ── 詞條：左側界欄 ── */
ol.list{
  list-style:none; margin:6px 0 0; padding:0 0 0 17px;
  border-left:1px solid var(--rule-soft);
}
li.entry{
  display:grid; grid-template-columns:1fr auto; gap:0 14px;
  padding:13px 0 14px; border-bottom:1px dotted var(--rule-soft); position:relative;
}
li.entry::before{
  content:""; position:absolute; left:-18px; top:24px;
  width:9px; height:1px; background:var(--rule);
}
li.entry.known::before{background:var(--cinnabar); height:2px; top:23px}
.head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.head .w{font-size:1.3rem; font-weight:700; letter-spacing:.1em; line-height:1.5}
li.entry.known .head .w{color:var(--ink-faint)}
.head .py{
  font-family:"Noto Sans","Segoe UI",Helvetica,Arial,sans-serif;
  font-weight:500; font-size:.99rem; color:var(--indigo-deep);
  letter-spacing:.015em; line-height:1.5;
  font-feature-settings:"kern" 1; font-variant-ligatures:none;
}
.mean{grid-column:1/2; margin:2px 0 0; font-size:.99rem; color:var(--ink-soft)}
.note{
  grid-column:1/2; margin:6px 0 0; font-size:.87rem; color:var(--cinnabar);
  border-left:2px solid var(--cinnabar); padding-left:10px;
}
.note::before{content:"朱批　"; letter-spacing:.2em; opacity:.75}

/* 熟＝鈐印 */
.mark{
  grid-row:1/2; grid-column:2/3; align-self:center;
  width:30px; height:30px; flex:none; cursor:pointer; padding:0;
  background:none; border:1px dashed var(--rule); border-radius:0;
  color:var(--ink-faint); font-family:inherit; font-size:.86rem;
  line-height:1; display:grid; place-items:center; letter-spacing:0;
}
.mark:hover{border-style:solid; border-color:var(--cinnabar); color:var(--cinnabar)}
.mark:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
.mark[aria-pressed="true"]{
  background:var(--cinnabar); border:1px solid var(--cinnabar);
  color:var(--seal-ink); font-weight:700;
}

/* ── 遮蔽自測 ── */
body.masked .mean{
  color:transparent; background:var(--surface-2); cursor:pointer; user-select:none;
}
body.masked .mean::after{content:"　點此顯示釋義"; color:var(--ink-faint); font-size:.86rem}
body.masked .note{display:none}
body.masked .entry.revealed .mean{color:var(--ink-soft); background:none; cursor:auto; user-select:auto}
body.masked .entry.revealed .mean::after{content:""}
body.masked .entry.revealed .note{display:block}

/* ── 測驗：只出拼音，作答後才揭曉 ── */
body.quiz .search, body.quiz #mask{display:none}
#quiz{margin:34px 0 0}
.quiz-card{position:relative; border:1px solid var(--rule); background:var(--paper); padding:24px 26px 20px}
.quiz-card::before{content:""; position:absolute; inset:5px; border:1px solid var(--rule-soft); pointer-events:none}
.q-top{
  display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
  font-size:.84rem; color:var(--ink-faint); letter-spacing:.06em;
  font-variant-numeric:tabular-nums;
}
.q-top b{color:var(--indigo); font-weight:700}
.q-size{display:inline-flex; align-items:center; gap:6px; letter-spacing:.06em}
.q-size select{
  font:inherit; font-size:.84rem; color:var(--ink); background:var(--surface);
  border:1px solid var(--rule); border-radius:0; padding:2px 6px; cursor:pointer;
}
.q-size select:focus-visible{outline:2px solid var(--indigo); outline-offset:1px}
.q-py{
  margin:24px 0 3px; text-align:center; font-weight:500;
  font-family:"Noto Sans","Segoe UI",Helvetica,Arial,sans-serif;
  font-size:clamp(1.45rem,5vw,2.05rem); color:var(--indigo-deep);
  letter-spacing:.02em; line-height:1.5; word-break:break-word;
}
.q-len{margin:0 0 20px; text-align:center; font-size:.83rem; color:var(--ink-faint); letter-spacing:.1em}
#qform{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
#qin{
  font:inherit; font-size:1.2rem; text-align:center; letter-spacing:.14em;
  width:min(300px,100%); padding:8px 12px; color:var(--ink);
  background:var(--surface); border:1px solid var(--rule); border-radius:0;
}
#qin:focus{outline:2px solid var(--indigo); outline-offset:1px}
#qin:disabled{opacity:.7}
.q-fb{margin:15px 0 0; min-height:1.7em; text-align:center; font-size:.96rem; letter-spacing:.05em}
.q-fb.good{color:var(--indigo)}
.q-fb.good::before{content:"○　"}
.q-fb.bad{color:var(--cinnabar)}
.q-fb.bad::before{content:"×　"}
.q-hint{
  margin:12px auto 0; max-width:58ch; font-size:.95rem; color:var(--ink-soft);
  border-left:2px solid var(--indigo); padding-left:12px;
}
.q-hint b{
  display:block; font-size:.78rem; font-weight:400; letter-spacing:.2em;
  color:var(--ink-faint); font-family:"Noto Sans","Segoe UI",Helvetica,Arial,sans-serif;
}
.chip[disabled]{opacity:.4; cursor:default; border-style:dotted}
.chip[disabled]:hover{border-color:var(--rule-soft); color:var(--ink-soft)}
#qrev{
  display:grid; grid-template-columns:1fr auto; gap:0 14px;
  margin:16px auto 0; max-width:58ch; padding-top:14px; border-top:1px dotted var(--rule);
}
.q-acts{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:20px 0 0}
.quiz-done{border:1px solid var(--rule); background:var(--paper); padding:26px 26px 22px; text-align:center}
.quiz-done h3{margin:0; font-size:1.2rem; letter-spacing:.13em}
.quiz-done .score{margin:16px 0 4px; font-size:2.3rem; font-weight:700; color:var(--cinnabar); font-variant-numeric:tabular-nums}
.quiz-done .sub{margin:0; font-size:.88rem; color:var(--ink-faint)}
.quiz-done ol{
  list-style:none; margin:22px auto 0; padding:16px 0 0; max-width:58ch;
  text-align:left; border-top:1px solid var(--rule);
}
.quiz-done ol li{padding:8px 0; border-bottom:1px dotted var(--rule-soft)}
.quiz-done ol .m{display:block; font-size:.92rem; color:var(--ink-soft)}
.quiz-done .cap{margin:18px 0 0; font-size:.86rem; color:var(--ink-faint); letter-spacing:.08em}

/* ── 回到頁首 ── */
.totop{
  position:fixed; right:22px; bottom:22px; z-index:30; width:44px; height:44px; padding:0;
  display:grid; place-items:center; cursor:pointer;
  background:var(--surface); color:var(--indigo);
  border:1px solid var(--ink); border-radius:0;
  box-shadow:0 2px 12px rgba(0,0,0,.16);
  opacity:0; transform:translateY(8px); pointer-events:none;
  transition:opacity .18s ease, transform .18s ease;
}
.totop::after{content:""; position:absolute; inset:3px; border:1px solid var(--rule-soft)}
.totop.show{opacity:1; transform:none; pointer-events:auto}
.totop:hover{color:var(--cinnabar); border-color:var(--cinnabar)}
.totop:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
.totop svg{width:19px; height:19px; fill:none; stroke:currentColor;
  stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}

.empty{padding:56px 0; text-align:center; color:var(--ink-faint); font-size:.95rem}
footer{
  margin:60px 0 0; padding-top:18px; border-top:1px solid var(--rule);
  font-size:.83rem; color:var(--ink-faint);
  display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap;
}

@media (max-width:560px){
  .wrap{padding:20px 12px 70px}
  .frame-in{padding:24px 20px 34px; margin:4px}
  .controls::before{inset:0 -20px}
  .seal{width:74px; height:74px; font-size:1.2rem}
  .head .w{font-size:1.2rem}
  .quiz-card,.quiz-done{padding:20px 16px 18px}
  .totop{right:14px; bottom:14px; width:40px; height:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

</head>
<body>
<div class="wrap"><div class="frame"><div class="frame-in">

  <header class="top">
    <div class="seal" aria-hidden="true"><span>生</span><span>詞</span><span>集</span><span>解</span></div>
    <div class="title-block">
      <p class="eyebrow">Vocabulary Notebook</p>
      <h1>生詞集解</h1>
      <div class="stats">
        <span><b>195</b> 詞條</span>
        <span><b>16</b> 類</span>
        <span>已熟 <b id="known">0</b> ／ 顯示 <b id="shown">195</b></span>
      </div>
    </div>
  </header>
  <hr class="rule">

  <div class="controls">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="q" type="search" placeholder="檢索詞語、拼音或釋義…" aria-label="檢索生詞">
    </label>
    <button class="tgl" id="mask" type="button" aria-pressed="false"><span class="dot"></span>遮蔽釋義</button>
    <button class="tgl" id="unknown" type="button" aria-pressed="false"><span class="dot"></span>只看未熟</button>
    <button class="tgl" id="quizbtn" type="button" aria-pressed="false"><span class="dot"></span>測驗</button>
    <button class="tgl" id="theme" type="button" aria-pressed="false"><span class="dot"></span><span id="themelbl">暗</span></button>
  </div>

  <nav class="cats" aria-label="分類篩選"><button class="chip" type="button" data-cat="all" aria-pressed="true">全部</button><button class="chip" type="button" data-cat="0" aria-pressed="false">一、時光流逝‧歲月</button><button class="chip" type="button" data-cat="1" aria-pressed="false">二、勤學苦讀‧精進</button><button class="chip" type="button" data-cat="2" aria-pressed="false">三、品德修養‧志節操守</button><button class="chip" type="button" data-cat="3" aria-pressed="false">四、言語‧口業‧論辯</button><button class="chip" type="button" data-cat="4" aria-pressed="false">五、過失‧改過‧責任</button><button class="chip" type="button" data-cat="5" aria-pressed="false">六、負面性情‧行為</button><button class="chip" type="button" data-cat="6" aria-pressed="false">七、戰亂‧太平‧同心</button><button class="chip" type="button" data-cat="7" aria-pressed="false">八、佛道‧修行用語</button><button class="chip" type="button" data-cat="8" aria-pressed="false">九、情緒‧心境</button><button class="chip" type="button" data-cat="9" aria-pressed="false">十、困境‧艱難‧虛妄</button><button class="chip" type="button" data-cat="10" aria-pressed="false">十一、處事智慧‧謀略</button><button class="chip" type="button" data-cat="11" aria-pressed="false">十二、才德‧人物‧身分</button><button class="chip" type="button" data-cat="12" aria-pressed="false">十三、景物‧器物‧意象</button><button class="chip" type="button" data-cat="13" aria-pressed="false">十四、日常動作‧行為</button><button class="chip" type="button" data-cat="14" aria-pressed="false">十五、字形辨析（繁體／異體）</button><button class="chip" type="button" data-cat="15" aria-pressed="false">十六、現代常用語‧泛用詞</button></nav>

  <main id="list"></main>

  <section id="quiz" hidden aria-label="拼音測驗">
    <div class="quiz-card" id="qcard">
      <div class="q-top">
        <span>第 <b id="qi">1</b> ／ <b id="qn">0</b> 題</span>
        <span>已答對 <b id="qright">0</b></span>
        <label class="q-size">每輪題數
          <select id="qsize" aria-label="每輪題數">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="0">全部</option>
          </select>
        </label>
      </div>
      <p class="q-py" id="qpy"></p>
      <p class="q-len" id="qlen"></p>
      <form id="qform" autocomplete="off">
        <input id="qin" type="text" placeholder="輸入詞語…" aria-label="輸入詞語"
               autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
        <button class="tgl" type="submit" id="qsubmit">作答</button>
      </form>
      <p class="q-fb" id="qfb" aria-live="polite"></p>
      <div id="qhints"></div>
      <div id="qrev" hidden></div>
      <div class="q-acts">
        <button class="chip" type="button" id="qprev">上一題</button>
        <button class="chip" type="button" id="qtip">提示</button>
        <button class="chip" type="button" id="qshow">看答案</button>
        <button class="chip" type="button" id="qnext">下一題</button>
        <button class="chip" type="button" id="qquit">結束測驗</button>
      </div>
    </div>
    <div class="quiz-done" id="qdone" hidden></div>
  </section>

  <footer>
    <span>拼音採漢語拼音；異讀依教育部《重編國語辭典》台灣通行音。</span>
    <span>「熟」字鈐印為個人記錄，各自存於自己的瀏覽器，不與他人共用。</span>
  </footer>

</div></div></div>

<button class="totop" id="totop" type="button" aria-label="回到頁首" title="回到頁首">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V5"></path><path d="M5.5 11.5L12 5l6.5 6.5"></path></svg>

<script>

": "", "hf": "「第一個字」上面是「分」，下面是「貝」；「第二個字」病字頭，裡面是「脊」", "hw": "「安 pín 樂道」的 pín；「jí 薄」的 jí"}, {"w": "逡巡", "p": "qūn xún", "m": "有所顧慮而徘徊不前、遲疑退卻。", "n": "", "hf": "「第一個字」走之底（辵部，辵讀作「綽」），裡面是「夋」；「第二個字」走之底（辵部，辵讀作「綽」），裡面是「巛」", "hw": "「xún 視」的 xún"}, {"w": "藩籬", "p": "fán lí", "m": "1. 用柴竹編成的屏蔽圍牆，引申為保護防衛。2. 範圍、界限。", "n": "", "hf": "「第一個字」草字頭（艸部），下面是「潘」；「第二個字」竹字頭，下面是「離」", "hw": "「寄人 lí 下」的 lí"}, {"w": "關礙", "p": "guān ài", "m": "阻礙、干擾、妨礙。", "n": "", "hf": "「第二個字」石字旁，右邊是「疑」", "hw": "「息息相 guān」的 guān；「窒 ài 難行」的 ài"}, {"w": "所生枝節", "p": "suǒ shēng zhī jié", "m": "節外生枝而招惹出來的麻煩事端。", "n": "", "hf": "「第三個字」木字旁，右邊是「支」；「第四個字」竹字頭，下面是「即」", "hw": "「金 zhī 玉葉」的 zhī；「不拘小 jié」的 jié"}, {"w": "殄沌", "p": "tiǎn dùn", "m": "雜亂無序、模糊不清、沒有條理的樣子。", "n": "", "hf": "「第一個字」歹字旁，右邊是「㐱」；「第二個字」左邊是三點水（水部），右邊是「屯」", "hw": "「混 dùn」的 dùn"}, {"w": "繁冗", "p": "fán rǒng", "m": "繁瑣冗長或事務繁多。指文字、流程或事情過於複雜，以致浪費時間、增加負擔。", "n": "", "hf": "「第一個字」上面是「敏」，下面是「糸」；「第二個字」上面是禿寶蓋，下面是「几」", "hw": "「名目 fán 多」的 fán；「rǒng 長」的 rǒng"}, {"w": "紛雜", "p": "fēn zá", "m": "繁多而雜亂，頭緒紛紜不易理清。", "n": "", "hf": "「第一個字」糸部（糸讀作「密」），右邊是「分」；「第二個字」右邊是短尾鳥的「隹」", "hw": "「五彩繽 fēn」的 fēn；「錯綜複 zá」的 zá"}, {"w": "離奇", "p": "lí qí", "m": "不合常理、出人意料，奇特曲折而難以理解。", "n": "", "hf": "「第一個字」左邊是「离」，右邊是「隹」；「第二個字」大字頭，下面是「可」", "hw": "「支 lí 破碎」的 lí；「突發 qí 想」的 qí"}, {"w": "萎縮", "p": "wěi suō", "m": "枯萎收縮；引申為衰退、減弱。", "n": "", "hf": "「第一個字」草字頭（艸部），下面是「委」；「第二個字」糸部（糸讀作「密」），右邊是「宿」", "hw": "「wěi 靡不振」的 wěi；「節衣 suō 食」的 suō"}, {"w": "侵蝕", "p": "qīn shí", "m": "逐漸損壞、消耗、腐蝕。", "n": "", "hf": "「第二個字」食部，右邊是「虫」", "hw": "「入 qīn」的 qīn；「磨 shí」的 shí"}, {"w": "救援", "p": "jiù yuán", "m": "援助解救陷於危難的人。", "n": "", "hf": "「第一個字」左邊是「求」，右邊是攴部（反文旁）；「第二個字」提手旁，右邊是「爰」", "hw": "「無可 jiù 藥」的 jiù；「圍城打 yuán」的 yuán"}, {"w": "海市蜃樓", "p": "hǎi shì shèn lóu", "m": "光線折射造成的虛幻景象。比喻虛幻不實的事物或空想。", "n": "", "hf": "「第三個字」外面是「辰」，裡面是「虫」；「第四個字」木字旁，右邊是「婁」", "hw": "「招搖過 shì」的 shì；「人去 lóu 空」的 lóu"}]}, {"cat": "十一、處事智慧‧謀略", "desc": "談決斷、時機與待人分寸的詞語", "items": [{"w": "因時制宜", "p": "yīn shí zhì yí", "m": "根據不同時期的情況，採取合宜的措施應對。", "n": "", "1. 鋪設陳列。2. 詳細地敘述、鋪敘展開（文章寫作手法）。", "n": "", "hf": "「第一個字」金部，右邊是「甫」；「第二個字」左耳旁（阜部），右邊是「東」", "hw": "「pū 路」的 pū；「chén 列」的 chén"}, {"w": "倣效", "p": "fǎng xiào", "m": "依照別人的方法、樣式或精神來模仿、效法。同「仿效」。", "n": "", "hf": "「第一個字」「人」加上「放」；「第二個字」左邊是「交」，右邊是攴部（反文旁）", "hw": "「行之有 xiào」的 xiào"}, {"w": "述遵", "p": "shù zūn", "m": "遵循、遵照執行前人所述。", "n": "", "hf": "「第一個字」走之底（辵部，辵讀作「綽」），裡面是「术」；「第二個字」走之底（辵部，辵讀作「綽」），裡面是「尊」", "hw": "「講 shù」的 shù；「zūn 時養晦」的 zūn"}, {"w": "承襲傳統", "p": "chéng xí chuán tǒng", "m": "承接沿襲前人的智慧、技藝、精神或文化，並加以傳承下去。", "n": "", "hf": "「第二個字」上面是「龍」，下面是「衣」；「第三個字」單人旁（人部），右邊是「專」", "hw": "「蹈常 xí 故」的 xí；「名不虛 chuán」的 chuán"}, {"w": "管保", "p": "guǎn bǎo", "m": "保證、包管，一定如此。", "n": "", "hf": "「第一個字」竹字頭，下面是「官」；「第二個字」單人旁（人部），右邊是「呆」", "hw": "「雙 guǎn 齊下」的 guǎn；「bǎo 家衛國」的 bǎo"}, {"w": "棐", "p": "fěi", "m": "本義為矯正弓弩的器具，引申為輔助、輔導。", "n": "", "hf": "「第一個字」上面是「非」，下面是「木」", "hw": ""}, {"w": "塑造形象", "p": "sù zào xíng xiàng", "m": "以言語、作為或文藝手法，建立起某人某物在他人心中的樣貌與評價。塑造＝用泥土等材料捏製成形，引申為刻意營造。", "n": "", "hf": "「第一個字」上面是「朔」，下面是「土」；「第二個字」走之底（辵部，辵讀作「綽」），裡面是「告」", "hw": "「泥 sù 木雕」的 sù；「登峰 zào 極」的 zào"}, {"w": "安撫", "p": "ān fǔ", "m": "安慰撫慰，使人心情平定、情緒安穩。", "n": "", "hf": "「第一個字」寶蓋頭（宀讀作「棉」），下面是「女」；「第二個字」提手旁（手部），右邊是「無」", "hw": "「隨遇而 ān」的 ān；「fǔ 今追昔」的 fǔ"}, {"w": "推薦", "p": "tuī jiàn", "m": "介紹好的人或事物，希望對方採用、任用或接受。", "n": "", "hf": "「第一個字」提手旁（手部），右邊是「隹」；「第二個字」草字頭（艸部），下面是「廌」", "hw": "「tuī 心置腹」的 tuī；「毛遂自 jiàn」的 jiàn"}, {"w": "依托", "p": "yī tuō", "m": "依靠、憑藉；也指假託某種名義。", "n": "亦作「依託」", "hf": "「第一個字」單人旁（人部），右邊是「衣」；「第二個字」提手旁（手部），右邊是「乇」", "hw": "「相 yī 為命」的 yī；「和盤 tuō 出」的 tuō"}]}, {"cat": "十五、字形辨析（繁體／異體）", "desc": "容易混用的正字、異體字與兩岸用字差異", "items": [{"w": "艷／豔", "p": "yàn", "m": "「艷」為「豔」的異體字，二字同義，指色彩鮮明華美。台灣正體多作「豔」。", "n": "", "hf": "「第一個字」左邊是「豐」，右邊是「色」", "hw": "「爭奇鬥 yàn」的 yàn"}, {"w": "審", "p": "shěn", "m": "「审」的繁體字。詳細考察、仔細分辨，如「審察」「審慎」。", "n": "", "hf": "「第一個字」寶蓋頭（宀讀作「棉」），下面是「番」", "hw": "「shěn 時度勢」的 shěn"}, {"w": "汙／污", "p": "wū", "m": "「汙」為「污」的異體，二字通用。「汙染」＝「污染」。", "n": "", "hf": "「第一個字」左邊是三點水（水部），右邊是「于」", "hw": "「同流合 wū」的 wū"}, {" const $ = s => document.querySelector(s);
const listRoot = $('#list');
const state = { q:'', cat:'all', masked:false, onlyUnknown:false, marks:{} };
const KEY = 'shengci-marks';


function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function render(){
  const q = state.q.trim().toLowerCase();
  let shown = 0;
  const parts = DATA.map((c, ci) => {
    const items = c.items.filter(it => {
      if (state.cat !== 'all' && state.cat !== String(ci)) return false;
      if (state.onlyUnknown && state.marks[it.w]) return false;
      if (!q) return true;
      return (it.w + it.p + it.m + it.n).toLowerCase().includes(q);
    });
    if (!items.length) return '';
    shown += items.length;
    return `<section class="cat" id="c${ci}">
      <div class="cat-head"><h2>${esc(c.cat)}</h2><span class="n">${items.length} 詞</span></div>
      <p class="cat-desc">${esc(c.desc)}</p>
      <ol class="list">${items.map(it => `
        <li class="entry${state.marks[it.w]?' known':''}" data-w="${esc(it.w)}">
          <div class="head"><span class="w">${esc(it.w)}</span><span class="py">${esc(it.p)}</span></div>
          <button class="mark" type="button" aria-pressed="${!!state.marks[it.w]}"
            title="鈐印表示已熟" aria-label="標記「${esc(it.w)}」為已熟">熟</button>
          <p class="mean">${esc(it.m)}</p>
          ${it.n ? `<p class="note">${esc(it.n)}</p>` : ''}
        </li>`).join('')}</ol>
    </section>`;
  });
  listRoot.innerHTML = parts.join('') || `<p class="empty">未見「${esc(state.q)}」相關詞條。</p>`;
  $('#shown').textContent = shown;
}

$('#q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('#mask').addEventListener('click', e => {
  state.masked = !state.masked;
  e.currentTarget.setAttribute('aria-pressed', state.masked);
  document.body.classList.toggle('masked', state.masked);
});
$('#unknown').addEventListener('click', e => {
  state.onlyUnknown = !state.onlyUnknown;
  e.currentTarget.setAttribute('aria-pressed', state.onlyUnknown);
  render();
  if (quiz.on) startQuiz();
});
document.querySelectorAll('nav.cats .chip').forEach(ch => ch.addEventListener('click', () => {
  state.cat = ch.dataset.cat;
  document.querySelectorAll('nav.cats .chip').forEach(o => o.setAttribute('aria-pressed', o === ch));
  render();
  if (quiz.on) startQuiz();
  if (state.cat !== 'all') window.scrollTo({top:0});
}));

listRoot.addEventListener('click', e => {
  const btn = e.target.closest('.mark');
  if (btn){
    const li = btn.closest('.entry'), w = li.dataset.w;
    if (state.marks[w]) delete state.marks[w]; else state.marks[w] = 1;
    btn.setAttribute('aria-pressed', !!state.marks[w]);
    li.classList.toggle('known', !!state.marks[w]);
    updateCount(); saveMarks();
    if (state.onlyUnknown) render();
    return;
  }
  if (state.masked){
    const li = e.target.closest('.entry');
    if (li) li.classList.toggle('revealed');
  }
});

function updateCount(){ $('#known').textContent = Object.keys(state.marks).length; }

/* 獨立網站版：標記只存於自己的瀏覽器 localStorage。 */
function saveMarks(){
  try{ localStorage.setItem(KEY, JSON.stringify(state.marks)); }catch(e){}
}

try{ const c = localStorage.getItem(KEY); if (c) state.marks = JSON.parse(c) || {}; }catch(e){}

render(); updateCount();

/* ── 回到頁首 ── */
const toTop = $('#totop');
addEventListener('scroll', () => toTop.classList.toggle('show', window.scrollY > 400), {passive:true});
toTop.addEventListener('click', () => {
  const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.scrollTo({top:0, behavior: smooth ? 'smooth' : 'auto'});
});

/* ── 測驗：只出拼音，作答後才揭曉釋義 ── */
const quiz = { on:false, q:[], i:0, rec:[] };
const norm = s => s.replace(/[\s　·・.,，。]/g,'');
const answers = it => it.w.split('／').map(norm).concat(norm(it.w));
const chars = s => Array.from(s.split('／')[0]).length;

function pool(){
  const out = [];
  DATA.forEach((c, ci) => {
    if (state.cat !== 'all' && state.cat !== String(ci)) return;
    c.items.forEach(it => { if (!(state.onlyUnknown && state.marks[it.w])) out.push(it); });
  });
  return out;
}
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function startQuiz(list){
  let items = shuffle((list || pool()).slice());
  if (!list){
    const size = parseInt($('#qsize').value, 10) || 0;
    if (size) items = items.slice(0, size);
  }
  quiz.on = true; quiz.q = items; quiz.i = 0;
  quiz.rec = items.map(() => null);
  document.body.classList.add('quiz');
  $('#quizbtn').setAttribute('aria-pressed', true);
  $('#quiz').hidden = false; listRoot.hidden = true;
  if (state.masked) $('#mask').click();
  $('#qdone').hidden = true;
  if (!items.length){
    $('#qcard').hidden = true; $('#qdone').hidden = false;
    $('#qdone').innerHTML = `<h3>此範圍沒有可測的詞</h3>
      <p class="cap">換一個分類，或關掉「只看未熟」再試。</p>`;
    return;
  }
  $('#qcard').hidden = false;
  showQ();
}
function endQuiz(){
  quiz.on = false;
  document.body.classList.remove('quiz');
  $('#quizbtn').setAttribute('aria-pressed', false);
  $('#quiz').hidden = true; listRoot.hidden = false;
  render();
}
function maskAns(text, w){          // 提示裡若出現答案，遮成「◯」
  let out = text;
  const forms = w.split('／').filter(Boolean);
  forms.forEach(f => { out = out.split(f).join('◯'.repeat(Array.from(f).length)); });
  // 連單字也遮：釋義常拿原字解原詞（「不推辭艱難辛苦」），不遮等於直接給答案
  forms.forEach(f => {
    Array.from(f).forEach(ch => { out = out.split(ch).join('◯'); });
  });
  return out;
}
function tiers(it){
  const two = [];
  if (it.hf) two.push({k:'字形', t:it.hf});
  if (it.hw) two.push({k:'關聯詞', t:it.hw});
  shuffle(two);                                  // 兩種提示隨機先後
  return two.concat([{k:'釋義', t:it.m}])
            .map(h => ({k:h.k, t:maskAns(h.t, it.w)}));
}
function rec(){
  if (!quiz.rec[quiz.i]) quiz.rec[quiz.i] = {done:false, correct:false, shown:0, tiers:tiers(quiz.q[quiz.i]), typed:''};
  return quiz.rec[quiz.i];
}
function score(){ return quiz.rec.filter(r => r && r.correct).length; }
function drawHints(){
  const r = rec();
  $('#qhints').innerHTML = r.tiers.slice(0, r.shown)
    .map(h => `<p class="q-hint"><b>${esc(h.k)}</b>${esc(h.t)}</p>`).join('');
  const left = r.tiers.length - r.shown;
  $('#qtip').disabled = left === 0;
  $('#qtip').textContent = left === 0 ? '提示用完' : `提示（還有 ${left}）`;
}
function showQ(){
  const it = quiz.q[quiz.i], r = rec();
  $('#qi').textContent = quiz.i + 1;
  $('#qn').textContent = quiz.q.length;
  $('#qright').textContent = score();
  $('#qpy').textContent = it.p;
  $('#qlen').textContent = `共 ${chars(it.w)} 字`;
  const inp = $('#qin');
  inp.value = r.typed || ''; inp.disabled = r.done;
  $('#qfb').textContent = r.done ? (r.correct ? '答對了' : '正解如下') : '';
  $('#qfb').className = 'q-fb' + (r.done ? (r.correct ? ' good' : ' bad') : '');
  drawHints();
  if (r.done) drawReveal(); else { $('#qrev').hidden = true; $('#qrev').innerHTML = ''; }
  const last = quiz.i + 1 === quiz.q.length;
  $('#qsubmit').textContent = r.done ? (last ? '看成績' : '下一題') : '作答';
  $('#qshow').disabled = r.done;
  $('#qprev').disabled = quiz.i === 0;
  $('#qnext').textContent = last ? '看成績' : '下一題';
  if (!r.done) inp.focus();
}
function drawReveal(){
  const it = quiz.q[quiz.i];
  $('#qrev').hidden = false;
  $('#qrev').innerHTML =
    `<div class="head"><span class="w">${esc(it.w)}</span><span class="py">${esc(it.p)}</span></div>
     <button class="mark" type="button" id="qmark" aria-pressed="${!!state.marks[it.w]}"
       title="鈐印表示已熟" aria-label="標記「${esc(it.w)}」為已熟">熟</button>
     <p class="mean">${esc(it.m)}</p>${it.n ? `<p class="note">${esc(it.n)}</p>` : ''}`;
}
function reveal(correct){
  const r = rec();
  if (r.done) return;
  r.done = true; r.correct = correct; r.typed = $('#qin').value;
  showQ();
}
function nextQ(){
  if (quiz.i + 1 >= quiz.q.length) finish();
  else { quiz.i++; showQ(); }
}
function prevQ(){ if (quiz.i > 0){ quiz.i--; showQ(); } }
function finish(){
  const n = quiz.q.length, r = score();
  const wrong = quiz.q.filter((it, i) => !(quiz.rec[i] && quiz.rec[i].correct));
  const hinted = quiz.rec.filter(x => x && x.correct && x.shown > 0).length;
  $('#qcard').hidden = true;
  $('#qdone').hidden = false;
  $('#qdone').innerHTML = `
    <h3>測驗完畢</h3>
    <p class="score">${r} ／ ${n}</p>
    <p class="sub">答對 ${r} 題${hinted ? `（其中 ${hinted} 題用了提示）` : ''}　·　答錯或略過 ${wrong.length} 題</p>
    ${wrong.length ? `<ol>${wrong.map(it => `<li><span class="w">${esc(it.w)}</span>
      <span class="py">　${esc(it.p)}</span><span class="m">${esc(it.m)}</span></li>`).join('')}</ol>` : ''}
    <div class="q-acts">
      ${wrong.length ? `<button class="chip" type="button" data-act="retry-wrong">只測答錯的 ${wrong.length} 題</button>` : ''}
      <button class="chip" type="button" data-act="retry">再測一次</button>
      <button class="chip" type="button" data-act="quit">回書頁</button>
    </div>`;
  quiz.wrongList = wrong;
  window.scrollTo({top:0, behavior:'auto'});
}

$('#quizbtn').addEventListener('click', () => { quiz.on ? endQuiz() : startQuiz(); });
$('#qsize').addEventListener('change', () => { if (quiz.on) startQuiz(); });
$('#qform').addEventListener('submit', e => {
  e.preventDefault();
  if (rec().done){ nextQ(); return; }
  const it = quiz.q[quiz.i], ans = norm($('#qin').value);
  if (!ans) return;
  if (answers(it).includes(ans)) reveal(true);
  else { $('#qfb').textContent = '再想想'; $('#qfb').className = 'q-fb bad'; $('#qin').select(); }
});
$('#qtip').addEventListener('click', () => {
  const r = rec();
  if (r.shown >= r.tiers.length) return;
  r.shown++; drawHints();
  if (!r.done) $('#qin').focus();
});
$('#qshow').addEventListener('click', () => { if (!rec().done) reveal(false); });
$('#qnext').addEventListener('click', nextQ);
$('#qprev').addEventListener('click', prevQ);
$('#qquit').addEventListener('click', endQuiz);
$('#quiz').addEventListener('click', e => {
  const mk = e.target.closest('#qmark');
  if (mk){
    const w = quiz.q[quiz.i].w;
    if (state.marks[w]) delete state.marks[w]; else state.marks[w] = 1;
    mk.setAttribute('aria-pressed', !!state.marks[w]);
    updateCount(); saveMarks();
    return;
  }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  if (act.dataset.act === 'retry') startQuiz();
  else if (act.dataset.act === 'retry-wrong') startQuiz(quiz.wrongList);
  else endQuiz();
});
addEventListener('keydown', e => { if (e.key === 'Escape' && quiz.on) endQuiz(); });

(function(){
  const root = document.documentElement, btn = $('#theme'), lbl = $('#themelbl'), TK = 'shengci-theme';
  const prefersDark = () => window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  function apply(t){
    if (t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
    const dark = t === 'dark' || (!t && prefersDark());
    btn.setAttribute('aria-pressed', dark);
    lbl.textContent = dark ? '明' : '暗';
    btn.setAttribute('aria-label', dark ? '切換為明亮版面' : '切換為暗色版面');
  }
  let saved = null; try{ saved = localStorage.getItem(TK); }catch(e){}
  apply(saved);
  btn.addEventListener('click', () => {
    const dark = root.getAttribute('data-theme') === 'dark' ||
                 (!root.hasAttribute('data-theme') && prefersDark());
    const t = dark ? 'light' : 'dark';
    try{ localStorage.setItem(TK, t); }catch(e){}
    apply(t);
  });
})();


</script>
